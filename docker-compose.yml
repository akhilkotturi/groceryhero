version: "3.9"

services:
  api:
    build: ./backend
    container_name: groceryhero_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    container_name: groceryhero_worker
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres
    command: python -m app.workers.scheduler

  redis:
    image: redis:7-alpine
    container_name: groceryhero_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: groceryhero_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: groceryhero
      POSTGRES_PASSWORD: groceryhero_secret
      POSTGRES_DB: groceryhero
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
